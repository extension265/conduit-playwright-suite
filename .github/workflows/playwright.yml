name: Playwright tests

on:
  push:
  pull_request:
  workflow_dispatch: # allows a manual re-run from the Actions tab

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bundled Chromium plus its Linux system libraries. PW_CHANNEL is not set, so this is what runs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Traces, screenshots and videos of failed or retried tests (open traces with: npx playwright show-trace <zip>).
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Stage the HTML report for GitHub Pages (pushes to main only); the job below deploys it.
      - name: Upload report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  # Publishes the latest main-branch report to https://extension265.github.io/conduit-playwright-suite/
  # Runs even when tests failed, so the report of a red build is viewable too.
  publish-report:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
